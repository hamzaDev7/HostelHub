<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="description" content="HostelHub - Professional Hostel Management System">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - HostelHub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/landing.css">
    <script id="aclib" type="text/javascript" src="//acscdn.com/script/aclib.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <div class="auth-container">
        <div class="card auth-card">
            <div class="auth-header">
                <div class="logo auth-logo">
                    <i data-lucide="building-2"></i> HostelHub
                </div>
                <h2>Reset Password</h2>
                <p>Enter your email to receive reset instructions</p>
            </div>
            
            <form id="reset-form">
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="Enter your email" required>
                </div>
                
                <button type="submit" class="btn btn-primary" style="width:100%; padding:0.75rem;">Send Instructions</button>
            </form>

            <div style="text-align:center; margin-top:1.5rem; font-size:0.875rem;">
                Back to <a href="login.html">Login</a>
            </div>
        </div>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/utils.js"></script>
    <script>
        lucide.createIcons();

        document.getElementById('reset-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const users = storage.get('hostel_users');
            
            if (users.find(u => u.email === email)) {
                utils.showToast('Password reset instructions sent to your email', 'success');
                setTimeout(() => window.location.href = 'login.html', 2000);
            } else {
                utils.showToast('Email not found in our records', 'error');
            }
        });
    </script>
    
<script type="text/javascript">
    aclib.runAutoTag({
        zoneId: 'emzmigl58g',
    });
</script>
</body>
</html>
