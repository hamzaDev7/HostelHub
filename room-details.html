<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="description" content="HostelHub - Professional Hostel Management System">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Details - HostelHub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <script id="aclib" type="text/javascript" src="//acscdn.com/script/aclib.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .room-header-img {
            width: 100%;
            height: 400px;
            object-fit: cover;
            border-radius: var(--radius-lg);
            margin-bottom: 2rem;
        }
        .details-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 2rem;
        }
        .amenities-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }
        .amenity-item {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--bg-main);
            padding: 0.5rem 1rem;
            border-radius: var(--radius-md);
            font-size: 0.875rem;
        }
        @media (max-width: 992px) {
            .details-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <i data-lucide="building-2" style="color:var(--primary); width:24px; height:24px;"></i>
                <h2>HostelHub</h2>
            </div>
            <nav class="sidebar-nav" id="sidebar-nav"></nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-header">
                <div class="header-left">
                    <button class="icon-btn" id="sidebar-toggle" aria-label="Toggle Sidebar"><i data-lucide="menu"></i></button>
                </div>
                <div class="header-right">
                    <button class="icon-btn mobile-search-btn" id="mobile-search-btn" style="display:none;" aria-label="Search">
                        <i data-lucide="search"></i>
                    </button>
                    <button class="icon-btn" id="theme-toggle" aria-label="Toggle Theme"><i data-lucide="moon"></i></button>
                    <a href="notifications.html" class="icon-btn"><i data-lucide="bell"></i></a>
                    <div class="user-dropdown">
                        <div class="user-info" id="user-dropdown-btn">
                            <div class="avatar" id="header-avatar-initial">U</div>
                            <div class="user-details">
                                <h4 id="header-user-name">User Name</h4>
                                <span id="header-user-role">Role</span>
                            </div>
                            <i data-lucide="chevron-down" style="width:16px;"></i>
                        </div>
                        <div class="dropdown-menu" id="user-dropdown-menu">
                            <a href="profile.html" class="dropdown-item"><i data-lucide="user" style="width:16px;"></i> Profile</a>
                            <a href="settings.html" class="dropdown-item admin-only" style="display:none;"><i data-lucide="settings" style="width:16px;"></i> Settings</a>
                            <div style="border-top:1px solid var(--border); margin:0.5rem 0;"></div>
                            <a href="#" class="dropdown-item" id="logout-btn"><i data-lucide="log-out" style="width:16px;"></i> Logout</a>
                        </div>
                    </div>
                </div>
            </header>

            <div class="page-content">
                <a href="rooms.html" class="btn btn-outline" style="margin-bottom:1rem;"><i data-lucide="arrow-left"></i> Back to Rooms</a>
                
                <div id="room-details-container">
                    <!-- Populated via JS -->
                </div>
            </div>
        </main>
    </div>

    <!-- Booking Modal -->
    <div class="modal-overlay" id="booking-modal">
        <div class="modal">
            <div class="modal-header">
                <h3>Book Room</h3>
                <button class="modal-close" onclick="closeBookingModal()"><i data-lucide="x"></i></button>
            </div>
            <form id="booking-form">
                <input type="hidden" id="book-room-id">
                <input type="hidden" id="book-room-price">
                <div class="form-group">
                    <label class="form-label">Check-in Date</label>
                    <input type="date" id="book-checkin" class="form-control" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Check-out Date</label>
                    <input type="date" id="book-checkout" class="form-control" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Number of Guests</label>
                    <input type="number" id="book-guests" class="form-control" min="1" required>
                </div>
                <div class="card bg-main" style="margin:1rem 0; padding:1rem; border:1px solid var(--border);">
                    <div style="display:flex; justify-content:space-between; margin-bottom:0.5rem;">
                        <span>Nights:</span>
                        <span id="calc-nights">0</span>
                    </div>
                    <div style="display:flex; justify-content:space-between; margin-bottom:0.5rem;">
                        <span>Subtotal:</span>
                        <span id="calc-subtotal">Rs 0</span>
                    </div>
                    <div style="display:flex; justify-content:space-between; margin-bottom:0.5rem;">
                        <span>Tax (5%):</span>
                        <span id="calc-tax">Rs 0</span>
                    </div>
                    <div style="border-top:1px solid var(--border); padding-top:0.5rem; display:flex; justify-content:space-between; font-weight:bold; font-size:1.1rem; color:var(--primary);">
                        <span>Total:</span>
                        <span id="calc-total">Rs 0</span>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%;">Confirm Booking</button>
            </form>
        </div>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const roomId = parseInt(urlParams.get('id'));
            
            if (!roomId) {
                window.location.href = 'rooms.html';
                return;
            }

            const room = storage.get('hostel_rooms').find(r => r.id === roomId);
            if (!room) {
                document.getElementById('room-details-container').innerHTML = '<h3>Room not found</h3>';
                return;
            }

            renderRoomDetails(room);

            // Calculation event listeners
            ['book-checkin', 'book-checkout'].forEach(id => {
                document.getElementById(id).addEventListener('change', calculatePrice);
            });
            
            document.getElementById('booking-form').addEventListener('submit', (e) => {
                e.preventDefault();
                submitBooking();
            });

            // Theme toggle (if not in app.js)
            const themeToggle = document.getElementById('theme-toggle');
            if(themeToggle) {
                themeToggle.addEventListener('click', () => {
                    document.body.classList.toggle('dark-mode');
                    const isDark = document.body.classList.contains('dark-mode');
                    themeToggle.innerHTML = `<i data-lucide="${isDark ? 'sun' : 'moon'}"></i>`;
                    lucide.createIcons();
                });
            }
        });

        function renderRoomDetails(room) {
            const container = document.getElementById('room-details-container');
            const badgeClass = utils.getStatusBadgeClass(room.status);
            const user = auth.getCurrentUser();
            
            let amenitiesHtml = (room.amenities || []).map(a => `<div class="amenity-item"><i data-lucide="check" style="color:var(--success); width:16px;"></i> ${a}</div>`).join('');
            
            let bookBtnHtml = '';
            if (room.status === 'Available') {
                bookBtnHtml = `<button class="btn btn-primary" style="width:100%; padding:1rem;" onclick="openBookingModal(${room.id}, ${room.price}, ${room.capacity})">Book This Room</button>`;
            } else {
                bookBtnHtml = `<button class="btn btn-secondary" style="width:100%; padding:1rem;" disabled>Currently ${room.status}</button>`;
            }

            container.innerHTML = `
                <img src="${room.image || 'https://images.unsplash.com/photo-1555854877-bab0e564b8d5?auto=format&fit=crop&q=80&w=1200'}" alt="Room ${room.number}" class="room-header-img">
                
                <div class="details-grid">
                    <div>
                        <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:1rem;">
                            <div>
                                <h1 style="margin:0;">Room ${room.number}</h1>
                                <p style="font-size:1.1rem;">${room.type} Room</p>
                            </div>
                            <span class="badge ${badgeClass}" style="font-size:1rem; padding:0.5rem 1rem;">${room.status}</span>
                        </div>
                        
                        <div class="card" style="margin-bottom:2rem;">
                            <h3>Description</h3>
                            <p>${room.description || 'No description available.'}</p>
                        </div>
                        
                        <div class="card">
                            <h3>Amenities</h3>
                            <div class="amenities-list">
                                ${amenitiesHtml || '<p>No amenities listed.</p>'}
                            </div>
                        </div>
                    </div>
                    
                    <div>
                        <div class="card" style="position:sticky; top:80px;">
                            <h3 style="border-bottom:1px solid var(--border); padding-bottom:1rem; margin-bottom:1rem;">Booking Summary</h3>
                            <div style="display:flex; justify-content:space-between; margin-bottom:1rem;">
                                <span style="color:var(--text-muted);">Price per night</span>
                                <strong style="font-size:1.25rem; color:var(--primary);">${utils.formatCurrency(room.price)}</strong>
                            </div>
                            <div style="display:flex; justify-content:space-between; margin-bottom:1rem;">
                                <span style="color:var(--text-muted);">Capacity</span>
                                <strong>Up to ${room.capacity} Guests</strong>
                            </div>
                            <div style="display:flex; justify-content:space-between; margin-bottom:2rem;">
                                <span style="color:var(--text-muted);">Floor</span>
                                <strong>Floor ${room.floor}</strong>
                            </div>
                            ${bookBtnHtml}
                        </div>
                    </div>
                </div>
            `;
            lucide.createIcons();
        }

        function openBookingModal(roomId, price, capacity) {
            document.getElementById('booking-modal').classList.add('active');
            document.getElementById('book-room-id').value = roomId;
            document.getElementById('book-room-price').value = price;
            document.getElementById('book-guests').max = capacity;
            
            // Set min date to today
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('book-checkin').min = today;
            document.getElementById('book-checkout').min = today;
            
            document.getElementById('booking-form').reset();
            calculatePrice();
        }

        function closeBookingModal() {
            document.getElementById('booking-modal').classList.remove('active');
        }

        function calculatePrice() {
            const checkin = document.getElementById('book-checkin').value;
            const checkout = document.getElementById('book-checkout').value;
            const price = parseFloat(document.getElementById('book-room-price').value);
            
            let nights = 0;
            let subtotal = 0;
            let tax = 0;
            let total = 0;

            if (checkin && checkout) {
                const ci = new Date(checkin);
                const co = new Date(checkout);
                if (co > ci) {
                    nights = utils.calculateNights(checkin, checkout);
                    subtotal = nights * price;
                    tax = subtotal * 0.05; // 5% tax
                    total = subtotal + tax;
                } else if (co <= ci) {
                    utils.showToast('Check-out must be after check-in', 'error');
                    document.getElementById('book-checkout').value = '';
                }
            }

            document.getElementById('calc-nights').textContent = nights;
            document.getElementById('calc-subtotal').textContent = utils.formatCurrency(subtotal);
            document.getElementById('calc-tax').textContent = utils.formatCurrency(tax);
            document.getElementById('calc-total').textContent = utils.formatCurrency(total);
        }

        function submitBooking() {
            const roomId = parseInt(document.getElementById('book-room-id').value);
            const checkin = document.getElementById('book-checkin').value;
            const checkout = document.getElementById('book-checkout').value;
            const guests = parseInt(document.getElementById('book-guests').value);
            
            if (new Date(checkout) <= new Date(checkin)) {
                utils.showToast('Invalid dates selected', 'error');
                return;
            }

            // Check if room is already booked in these dates
            const allBookings = storage.get('hostel_bookings');
            const overlapping = allBookings.find(b => {
                if (b.roomId !== roomId || b.status === 'Cancelled' || b.status === 'Checked Out') return false;
                const bStart = new Date(b.checkIn);
                const bEnd = new Date(b.checkOut);
                const nStart = new Date(checkin);
                const nEnd = new Date(checkout);
                return (nStart < bEnd && nEnd > bStart);
            });

            if (overlapping) {
                utils.showToast('Room is not available for selected dates', 'error');
                return;
            }

            const room = storage.get('hostel_rooms').find(r => r.id === roomId);
            const price = parseFloat(document.getElementById('book-room-price').value);
            const nights = utils.calculateNights(checkin, checkout);
            const amount = (nights * price) * 1.05; // +5% tax

            const currentUser = auth.getCurrentUser();

            const newBooking = storage.add('hostel_bookings', {
                guestId: currentUser.id,
                guestName: currentUser.name,
                roomId: room.id,
                roomNumber: room.number,
                checkIn: checkin,
                checkOut: checkout,
                guests: guests,
                amount: amount,
                paymentStatus: 'Pending',
                status: 'Confirmed',
                date: new Date().toISOString().split('T')[0]
            });

            // Update room status
            room.status = 'Reserved';
            storage.update('hostel_rooms', room.id, room);

            // Add Notification
            storage.add('hostel_notifications', {
                title: 'New Booking',
                message: `${currentUser.name} booked room ${room.number}.`,
                date: new Date().toISOString(),
                read: false
            });

            utils.showToast('Booking successful!', 'success');
            closeBookingModal();
            
            setTimeout(() => {
                window.location.href = currentUser.role === 'Guest' ? 'my-bookings.html' : 'bookings.html';
            }, 1500);
        }
    </script>
    
<script type="text/javascript">
    aclib.runAutoTag({
        zoneId: 'emzmigl58g',
    });
</script>
</body>
</html>
