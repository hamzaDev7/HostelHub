<!DOCTYPE html>
<html lang="en">

<head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9599135254804434"
        crossorigin="anonymous"></script>
    <meta name="description" content="HostelHub - Professional Hostel Management System">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - HostelHub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/responsive.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Simple Chart.js for charts -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <i data-lucide="building-2" style="color:var(--primary); width:24px; height:24px;"></i>
                <h2>HostelHub</h2>
            </div>
            <nav class="sidebar-nav" id="sidebar-nav">
                <!-- Nav generated by app.js -->
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-header">
                <div class="header-left">
                    <button class="icon-btn" id="sidebar-toggle" aria-label="Toggle Sidebar">
                        <i data-lucide="menu"></i>
                    </button>
                    <div class="search-wrapper" id="search-wrapper" style="position:relative;">
                        <i data-lucide="search"
                            style="position:absolute; left:10px; top:50%; transform:translateY(-50%); width:16px; color:var(--text-muted);"></i>
                        <input type="text" id="search-input" class="form-control" placeholder="Search..."
                            style="padding-left:2.5rem; width:250px; border-radius:var(--radius-full);">
                    </div>
                </div>
                <div class="header-right">
                    <button class="icon-btn mobile-search-btn" id="mobile-search-btn" style="display:none;"
                        aria-label="Search">
                        <i data-lucide="search"></i>
                    </button>
                    <button class="icon-btn" id="theme-toggle" aria-label="Toggle Theme">
                        <i data-lucide="moon"></i>
                    </button>
                    <a href="notifications.html" class="icon-btn" style="position:relative;">
                        <i data-lucide="bell"></i>
                        <span
                            style="position:absolute; top:5px; right:5px; width:8px; height:8px; background:var(--danger); border-radius:50%;"></span>
                    </a>
                    <div class="user-dropdown">
                        <div class="user-info" id="user-dropdown-btn">
                            <div class="avatar" id="header-avatar-initial">U</div>
                            <div class="user-details">
                                <h4 id="header-user-name">User Name</h4>
                                <span id="header-user-role">Role</span>
                            </div>
                            <i data-lucide="chevron-down" style="width:16px;"></i>
                        </div>
                        <div class="dropdown-menu" id="user-dropdown-menu">
                            <a href="profile.html" class="dropdown-item"><i data-lucide="user" style="width:16px;"></i>
                                Profile</a>
                            <a href="settings.html" class="dropdown-item admin-only" style="display:none;"><i
                                    data-lucide="settings" style="width:16px;"></i> Settings</a>
                            <div style="border-top:1px solid var(--border); margin:0.5rem 0;"></div>
                            <a href="#" class="dropdown-item" id="logout-btn"><i data-lucide="log-out"
                                    style="width:16px;"></i> Logout</a>
                        </div>
                    </div>
                </div>
            </header>

            <div class="page-content">
                <div class="page-header">
                    <div>
                        <h2>Dashboard</h2>
                        <p>Welcome back, <span id="welcome-name">User</span>!</p>
                    </div>
                    <div id="dashboard-actions">
                        <!-- Dynamic actions based on role -->
                    </div>
                </div>

                <div class="stats-grid" id="stats-container">
                    <!-- Populated via JS -->
                </div>

                <div class="charts-grid" id="charts-container" style="display:none;">
                    <div class="card">
                        <h3>Revenue Overview</h3>
                        <div class="chart-container">
                            <canvas id="revenueChart"></canvas>
                        </div>
                    </div>
                    <div class="card">
                        <h3>Room Occupancy</h3>
                        <div class="chart-container">
                            <canvas id="occupancyChart"></canvas>
                        </div>
                    </div>
                </div>

                <div id="recent-activity-container" style="margin-top:2rem;">
                    <!-- Populated via JS -->
                </div>
            </div>
        </main>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script src="js/dashboard.js"></script>


</body>

</html>
