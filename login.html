<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="description" content="HostelHub - Professional Hostel Management System">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - HostelHub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/landing.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <div class="auth-container">
        <div class="card auth-card">
            <div class="auth-header">
                <div class="logo auth-logo">
                    <i data-lucide="building-2"></i> HostelHub
                </div>
                <h2>Welcome Back</h2>
                <p>Sign in to your account to continue</p>
            </div>
            
            <form id="login-form">
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <div style="display:flex; justify-content:space-between;">
                        <label class="form-label">Password</label>
                        <a href="forgot-password.html" style="font-size:0.875rem;">Forgot Password?</a>
                    </div>
                    <div style="position:relative;">
                        <input type="password" id="password" class="form-control" placeholder="Enter your password" required>
                        <button type="button" id="toggle-password" style="position:absolute; right:10px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; color:var(--text-muted);">
                            <i data-lucide="eye"></i>
                        </button>
                    </div>
                </div>
                <div class="form-group" style="display:flex; align-items:center; gap:10px;">
                    <input type="checkbox" id="remember">
                    <label for="remember" style="font-size:0.875rem; color:var(--text-muted);">Remember Me</label>
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%; padding:0.75rem;">Login</button>
            </form>

            <div style="text-align:center; margin-top:1.5rem; font-size:0.875rem;">
                Don't have an account? <a href="signup.html">Create Account</a>
            </div>

            <div style="margin-top:2rem; padding-top:1rem; border-top:1px solid var(--border);">
                <p style="font-size:0.75rem; text-align:center; margin-bottom:1rem;">Demo Credentials:</p>
                <div style="display:flex; flex-direction:column; gap:0.5rem;">
                    <button class="btn btn-outline btn-sm demo-login" data-email="admin@hostelhub.com" data-pass="Admin@123">Super Admin Demo</button>
                    <button class="btn btn-outline btn-sm demo-login" data-email="manager@hostelhub.com" data-pass="Manager@123">Manager Demo</button>
                    <button class="btn btn-outline btn-sm demo-login" data-email="reception@hostelhub.com" data-pass="Reception@123">Receptionist Demo</button>
                    <button class="btn btn-outline btn-sm demo-login" data-email="cleaner@hostelhub.com" data-pass="Cleaner@123">Housekeeping Demo</button>
                    <button class="btn btn-outline btn-sm demo-login" data-email="guest@hostelhub.com" data-pass="Guest@123">Guest Demo</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
    <script>
        lucide.createIcons();

        // Redirect if already logged in
        if (auth.getCurrentUser()) {
            window.location.href = 'dashboard.html';
        }

        const togglePassword = document.getElementById('toggle-password');
        const passwordInput = document.getElementById('password');
        
        togglePassword.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            togglePassword.innerHTML = `<i data-lucide="${type === 'password' ? 'eye' : 'eye-off'}"></i>`;
            lucide.createIcons();
        });

        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = passwordInput.value;

            const user = auth.login(email, password);
            if (user) {
                utils.showToast('Login successful', 'success');
                setTimeout(() => window.location.href = 'dashboard.html', 1000);
            } else {
                utils.showToast('Invalid email or password', 'error');
            }
        });

        document.querySelectorAll('.demo-login').forEach(btn => {
            btn.addEventListener('click', () => {
                storage.loadDemoData();
                document.getElementById('email').value = btn.dataset.email;
                passwordInput.value = btn.dataset.pass;
                document.getElementById('login-form').dispatchEvent(new Event('submit'));
            });
        });
    </script>
</body>
</html>
