<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="description" content="HostelHub - Professional Hostel Management System">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - HostelHub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/landing.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <div class="auth-container">
        <div class="card auth-card">
            <div class="auth-header">
                <div class="logo auth-logo">
                    <i data-lucide="building-2"></i> HostelHub
                </div>
                <h2>Create Account</h2>
                <p>Join HostelHub today</p>
            </div>
            
            <form id="signup-form">
                <div class="form-group">
                    <label class="form-label">Full Name</label>
                    <input type="text" id="name" class="form-control" placeholder="Enter your full name" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Phone Number</label>
                    <input type="text" id="phone" class="form-control" placeholder="Enter your phone number" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="Create a password" required minlength="6">
                </div>
                <div class="form-group">
                    <label class="form-label">Confirm Password</label>
                    <input type="password" id="confirm-password" class="form-control" placeholder="Confirm your password" required minlength="6">
                </div>
                <div class="form-group">
                    <label class="form-label">Account Type</label>
                    <select id="role" class="form-control" required>
                        <option value="Guest">Guest</option>
                        <option value="Manager">Manager</option>
                        <option value="Receptionist">Receptionist</option>
                        <option value="Housekeeping">Housekeeping</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%; padding:0.75rem;">Sign Up</button>
            </form>

            <div style="text-align:center; margin-top:1.5rem; font-size:0.875rem;">
                Already have an account? <a href="login.html">Login</a>
            </div>
        </div>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
    <script>
        lucide.createIcons();

        document.getElementById('signup-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirm-password').value;
            const role = document.getElementById('role').value;

            if (password !== confirm) {
                utils.showToast('Passwords do not match', 'error');
                return;
            }

            const users = storage.get('hostel_users');
            if (users.find(u => u.email === email)) {
                utils.showToast('Email already in use', 'error');
                return;
            }

            const newUser = storage.add('hostel_users', {
                name, email, phone, password, role
            });

            if (role === 'Guest') {
                storage.add('hostel_guests', {
                    name, email, phone, status: 'Active'
                });
            } else {
                storage.add('hostel_staff', {
                    name, email, phone, role, status: 'Active', joiningDate: new Date().toISOString().split('T')[0]
                });
            }

            utils.showToast('Account created successfully', 'success');
            setTimeout(() => {
                auth.login(email, password);
                window.location.href = 'dashboard.html';
            }, 1000);
        });
    </script>
</body>
</html>
